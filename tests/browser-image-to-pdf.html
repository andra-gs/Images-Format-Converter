<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to PDF Browser QA</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 32px auto; padding: 0 20px; line-height: 1.5; }
    h1 { margin-bottom: 4px; }
    .muted { color: #888; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    label { display: grid; gap: 4px; font-size: 14px; }
    input, select, button { font: inherit; padding: 8px 10px; }
    button { cursor: pointer; }
    #status { min-height: 28px; white-space: pre-wrap; }
    progress { width: 100%; }
    iframe { width: 100%; height: 70vh; border: 1px solid #8886; margin-top: 16px; }
    #download { display: inline-block; margin-top: 12px; }
    pre { overflow: auto; background: #8882; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Image to PDF Browser QA</h1>
  <p class="muted">Manual browser verification for the Phase 8 engine. Files are processed locally and are not uploaded.</p>

  <label>
    Select images
    <input id="files" type="file" accept="image/*" multiple />
  </label>

  <div class="controls">
    <label>Page size
      <select id="page-size">
        <option value="A4">A4</option>
        <option value="A5">A5</option>
        <option value="LETTER">Letter</option>
        <option value="IMAGE">Image Size (96 PPI)</option>
      </select>
    </label>
    <label>Orientation
      <select id="orientation">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
        <option value="auto">Auto</option>
      </select>
    </label>
    <label>Placement
      <select id="fit">
        <option value="contain">Fit / Contain</option>
        <option value="cover">Fill / Cover</option>
      </select>
    </label>
    <label>Uniform margin (mm)
      <input id="margin" type="number" min="0" max="250" step="0.5" value="10" />
    </label>
  </div>

  <button id="generate" type="button">Generate PDF</button>
  <button id="cancel" type="button" disabled>Cancel</button>
  <progress id="progress" max="100" value="0"></progress>
  <p id="status" role="status" aria-live="polite">Choose one or more images to begin.</p>
  <a id="download" hidden download="converted.pdf">Download generated PDF</a>
  <iframe id="preview" title="Generated PDF preview" hidden></iframe>
  <h2>Run details</h2>
  <pre id="details">No export yet.</pre>

  <script type="module" src="./browser-image-to-pdf.js"></script>
</body>
</html>
