name: Xanitizer Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: xanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-analysis:
    name: Xanitizer SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Xanitizer license availability
        id: license-check
        env:
          XANITIZER_LICENSE: ${{ secrets.XANITIZER_LICENSE }}
        shell: bash
        run: |
          if [ -n "$XANITIZER_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Xanitizer license is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Xanitizer skipped::Add the XANITIZER_LICENSE repository secret to enable security analysis."
          fi

      - name: Set up Node.js
        if: steps.license-check.outputs.available == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        if: steps.license-check.outputs.available == 'true'
        run: npm ci

      - name: Run Xanitizer Security Analysis
        id: xanitizer
        if: steps.license-check.outputs.available == 'true'
        uses: RIGS-IT/xanitizer-action@v1
        with:
          license: ${{ secrets.XANITIZER_LICENSE }}
          performNodeAudit: true
          logLevel: INFO
          # Keep the first scans non-blocking while the baseline is reviewed.
          # Enable haltOnFindings only after agreeing on a findings threshold.
          findingsListReportOutputFiles: Xanitizer-Findings-List.pdf,Xanitizer-Findings-List.sarif

      - name: Upload findings to GitHub Code Scanning
        if: steps.xanitizer.outcome == 'success' && hashFiles('Xanitizer-Findings-List.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: Xanitizer-Findings-List.sarif
          category: xanitizer

      - name: Archive Xanitizer reports
        if: steps.xanitizer.outcome == 'success' && hashFiles('Xanitizer-Findings-List.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xanitizer-security-reports
          path: |
            Xanitizer-Findings-List.pdf
            Xanitizer-Findings-List.sarif
          if-no-files-found: warn
          retention-days: 14
